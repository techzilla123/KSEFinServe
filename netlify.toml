[build]
  # Build the site and the Netlify Functions that hold the service-role key.
  command = "npm run build"
  # Point the publish directory to your dist folder
  publish = "dist"
  # Where the server-side functions live
  functions = "netlify/functions"

# The admin directory function needs the service-role key, which must never be
# bundled. It is read from the Netlify environment at runtime.
[functions.admin-directory]
  external_node_modules = ["@supabase/supabase-js"]

# Omit specific environment variable values from secrets scanning
# These are expected to be in the build output as they're used in the application
[secrets]
  scan = true
  omit_keys = [
    "EMAIL_FROM",
    "EMAIL_FROM_NAME",
    "SMTP_HOST",
    "SMTP_PORT",
    "SMTP_USER",
    "SMTP_PASS",
    "EMAIL_FROM",
    "ADMIN_ALLOWED_ORIGIN",
    "VITE_GEMINI_API_KEY",
    "VITE_GEMINI_NAME",
    "VITE_GEMINI_PROJECT_NAME",
    "VITE_GEMINI_PROJECT_NUMBER",
    "VITE_SUPABASE_URL",
    "VITE_SUPABASE_ANON_KEY",
    "VITE_SUPABASE_SERVICE_ROLE_KEY",
    "SUPABASE_URL",
    "SERVICE_ROLE_KEY",
    "VITE_SUPABASE_URL",
    "VITE_SUPABASE_ANON_KEY",
    "VITE_SUPABASE_SERVICE_ROLE_KEY"
  ]

